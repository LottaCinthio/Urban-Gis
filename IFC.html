        // Logik för att rita omgivning
        async function loadContext(v) {
            console.log("Försöker ladda karta...");
            try {
                const [bRes, rRes] = await Promise.all([
                    fetch('./data/buildings_with_id.geojson'),
                    fetch('./data/roads.geojson')
                ]);
                const bData = await bRes.json();
                const rData = await rRes.json();

                const scene = v._scene || v.context?.getScene();
                if (!scene) return;

                // Använd Building 8052 som nollpunkt
                const anchor = bData.features.find(f => f.properties.Building_ID == 8052);
                if (!anchor) return;

                const lon0 = anchor.geometry.coordinates[0][0][0];
                const lat0 = anchor.geometry.coordinates[0][0][1];
                const scale = 111320;

                // Rita vägar
                const roadMat = new THREE.LineBasicMaterial({ color: 0x666666 });
                rData.features.forEach(f => {
                    if (f.geometry.type === "LineString") {
                        const pts = f.geometry.coordinates.map(c => {
                            const x = (c[0] - lon0) * (scale * Math.cos(lat0 * Math.PI / 180));
                            const z = (c[1] - lat0) * scale;
                            return new THREE.Vector3(x, -2, z);
                        });
                        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), roadMat));
                    }
                });

                // Rita hus
                const buildMat = new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
                bData.features.forEach(f => {
                    if (f.properties.Building_ID == 8052) return;
                    const shape = new THREE.Shape();
                    f.geometry.coordinates[0].forEach((c, i) => {
                        const x = (c[0] - lon0) * (scale * Math.cos(lat0 * Math.PI / 180));
                        const z = (c[1] - lat0) * scale;
                        if (i === 0) shape.moveTo(x, z); else shape.lineTo(x, z);
                    });
                    const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 10, bevelEnabled: false }), buildMat);
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.position.y = -2;
                    scene.add(mesh);
                });
                console.log("Kartan är på plats!");
            } catch (e) { console.error("Karta-fel:", e); }
        }

        // Starta viewern
        $(document).ready(function() {
            if (typeof Viewer !== 'undefined') {
                const viewer = new Viewer("viewer");
                viewer.on("loaded", () => {
                    viewer.start();
                    loadContext(viewer);
                });
                // Ladda din modell här (unzip/loadAsync)
                // viewer.loadAsync(envelope);
            } else {
                console.error("xBIM Viewer hittades inte. Kontrollera skript-referenser.");
            }
        });
    </script>
