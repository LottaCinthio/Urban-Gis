                    fetch('./data/roads.geojson')
                ]);
                const bData = await bRes.json();
                const rData = await rRes.json();

                // Hitta xBIM-scenen (Three.js)
                const scene = viewerInstance._scene || viewerInstance.context?.getScene();
                if (!scene) return;

                // Använd byggnad 8052 som nollpunkt (0,0,0)
                const anchor = bData.features.find(f => f.properties.Building_ID == 8052);
                if (!anchor) return console.error("Hittade inte byggnad 8052");

                const lon0 = anchor.geometry.coordinates[0][0][0];
                const lat0 = anchor.geometry.coordinates[0][0][1];
                const scale = 111320;

                // Rita Vägar
                const roadMat = new THREE.LineBasicMaterial({ color: 0x666666 });
                rData.features.forEach(f => {
                    if (f.geometry.type === "LineString") {
                        const pts = [];
                        f.geometry.coordinates.forEach(c => {
                            const x = (c[0] - lon0) * (scale * Math.cos(lat0 * Math.PI / 180));
                            const z = (c[1] - lat0) * scale;
                            pts.push(new THREE.Vector3(x, -1.5, z));
                        });
                        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), roadMat));
                    }
                });

                // Rita Grannhus
                const buildMat = new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
                bData.features.forEach(f => {
                    if (f.properties.Building_ID == 8052) return;
                    const shape = new THREE.Shape();
                    f.geometry.coordinates[0].forEach((c, i) => {
                        const x = (c[0] - lon0) * (scale * Math.cos(lat0 * Math.PI / 180));
                        const z = (c[1] - lat0) * scale;
                        if (i === 0) shape.moveTo(x, z); else shape.lineTo(x, z);
                    });
                    const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 10, bevelEnabled: false }), buildMat);
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.position.y = -1.5;
                    scene.add(mesh);
                });
                console.log("Karta inlagd!");
            } catch (err) { console.error("Karta-fel:", err); }
        }

        // HÄR ÄR ÄNDRINGEN I DIN ORIGINALKOD:
        // Vi kör drawMapContext() exakt när viewern säger "loaded"
        window.onload = () => {
            const viewer = new xViewer("viewer");
            viewer.on("loaded", () => {
                viewer.start();
                viewer.show(ViewType.DEFAULT);
                // NU KÖR VI KARTAN
                drawMapContext(viewer);
            });

            // Här laddas din modell
            unzipByteArray(base64ToByteArray(model)).then(e => {
                const envelope = new xModelEnvelope(e);
                viewer.loadAsync(envelope);
            });
        };
    </script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    </body>
