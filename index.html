<div class="layer-group">
      <div class="group-header">Accessibility & Amenities</div>
      
      <div class="layer-item">
        <div class="row-container">
          <span><img src="./icons/health.svg" class="mini-icon"> Health Center</span>
          <label class="switch small"><input type="checkbox" id="toggleHealthcare" checked><span class="slider"></span></label>
        </div>
        <div class="row-container">
          <span class="indent-text">Walking Zones (Health)</span>
          <label class="switch small"><input type="checkbox" id="toggleHealthWalk"><span class="slider"></span></label>
        </div>
        <div class="legend-container">
          <div class="legend-item"><span class="zone-box h-5"></span> 5 min</div>
          <div class="legend-item"><span class="zone-box h-10"></span> 10 min</div>
          <div class="legend-item"><span class="zone-box h-15"></span> 15 min</div>
        </div>
      </div>

      <div class="layer-item" style="margin-top:10px;">
        <div class="row-container">
          <span><img src="./icons/school.svg" class="mini-icon"> Schools</span>
          <label class="switch small"><input type="checkbox" id="toggleSchools" checked><span class="slider"></span></label>
        </div>
        <div class="row-container">
          <span class="indent-text">Walking Zones (School)</span>
          <label class="switch small"><input type="checkbox" id="toggleWalk"><span class="slider"></span></label>
        </div>
        <div class="legend-container">
          <div class="legend-item"><span class="zone-box s-5"></span> 5 min</div>
          <div class="legend-item"><span class="zone-box s-10"></span> 10 min</div>
          <div class="legend-item"><span class="zone-box s-15"></span> 15 min</div>
        </div>
      </div>
    </div>

    <div class="layer-group">
      <div class="group-header">Infrastructure</div>
      <div class="row-container">
        <span>Buildings</span>
        <label class="switch small"><input type="checkbox" id="toggleBuildings" checked><span class="slider"></span></label>
      </div>
      <div class="no-toggle">
        <span><span class="zone-box building-target-box"></span> 3D model (Project Building)</span>
      </div>
      </div>
