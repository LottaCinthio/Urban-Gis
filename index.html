<div class="layer-group">
  <div class="group-header">Emergency Services & Safety (2020-2023)</div>
  
  <div class="layer-item">
    <div class="row-container">
      <span><img src="./icons/hospital-marker.svg" class="mini-icon"> Hospital</span>
      <label class="switch"><input type="checkbox" id="toggleHospital" checked><span class="slider"></span></label>
    </div>
    <div class="row-container">
      <span class="indent-text"><img src="./icons/incident-house.svg" class="mini-icon"> Hospital Incidents</span>
      <label class="switch small"><input type="checkbox" id="toggleIncidents" checked><span class="slider"></span></label>
    </div>
    <div class="row-container">
      <span class="indent-text"><span class="route-line hospital-line"></span> Hospital Routes</span>
      <label class="switch small"><input type="checkbox" id="toggleRoutes" checked><span class="slider"></span></label>
    </div>
  </div>

  <div class="layer-item" style="margin-top:10px;">
    <div class="row-container">
      <span><img src="./icons/firestation-marker.svg" class="mini-icon"> Fire Station</span>
      <label class="switch"><input type="checkbox" id="toggleFirestation" checked><span class="slider"></span></label>
    </div>
    <div class="row-container">
      <span class="indent-text"><img src="./icons/fire-incident-house.svg" class="mini-icon"> Fire Incidents</span>
      <label class="switch small"><input type="checkbox" id="toggleFireIncidents" checked><span class="slider"></span></label>
    </div>
    <div class="row-container">
      <span class="indent-text"><span class="route-line fire-line"></span> Fire Routes</span>
      <label class="switch small"><input type="checkbox" id="toggleFireRoutes" checked><span class="slider"></span></label>
    </div>
  </div>

  <div class="layer-item" style="margin-top:10px;">
    <div class="row-container">
      <span><img src="./icons/police-marker.svg" class="mini-icon"> Police Station</span>
      <label class="switch"><input type="checkbox" id="togglePolice" checked><span class="slider"></span></label>
    </div>
    <div class="row-container">
      <span class="indent-text"><img src="./icons/crime-incident.svg" class="mini-icon"> Crimes</span>
      <label class="switch small"><input type="checkbox" id="toggleCrimes" checked><span class="slider"></span></label>
    </div>
    <div class="row-container">
      <span class="indent-text"><span class="route-line police-line"></span> Police Routes</span>
      <label class="switch small"><input type="checkbox" id="togglePoliceRoutes" checked><span class="slider"></span></label>
    </div>
  </div>
</div>
